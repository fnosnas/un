name: Build Unikraft OCI Archive

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: unikraft/setup-action@v1

      - name: Build OCI archive
        run: |
          mkdir -p ./dist
          unikraft build . --output ./dist/ws-un.oci.tar
          ls -lh ./dist/ws-un.oci.tar

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest-build ./dist/ws-un.oci.tar --title "Latest Build" --notes "Unikraft OCI archive" || \
          gh release upload latest-build ./dist/ws-un.oci.tar --clobber
