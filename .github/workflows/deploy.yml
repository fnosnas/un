name: Build Unikraft Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: unikraft/setup-action@v1

      - name: Check CLI auth options
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
        run: |
          unikraft --help || true
          unikraft login --help || true
          test -n "$UKC_TOKEN" && echo "UKC_TOKEN is set" || echo "UKC_TOKEN is empty"

      - name: Build and push to Unikraft Cloud
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
        run: |
          unikraft build . --output musebot/ws-un:latest
