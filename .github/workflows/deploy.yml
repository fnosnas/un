name: Build Unikraft Artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: unikraft/setup-action@v1

      - name: Build rootfs / image artifact
        run: |
          unikraft build --help || true
          unikraft build .
          ls -la
